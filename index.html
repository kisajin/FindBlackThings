<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Canvas 二値化・枠線</title>
    <style>
        fieldset {
            width: 300px;
            margin: 10px;
            padding-top: 5px;
            padding-bottom: 5px;
            padding-left: 10px;
        }
        canvas {
            border: 1px solid #ccc; /* 処理前のcanvasにも枠を表示 */
        }
        .container {
            margin-top: 10px;
        }
    </style>
</head>
<body>
    
    <!-- 二値化の閾値 -->
    <label for="threshold">閾値(0~255):</label>
    <input type="range" id="threshold" name="threshold" min="0" max="255" value="128"/>
    値: <output id="value"></output>
    
    <fieldset>
        <legend>輪郭線を描く</legend>
        <form id="radio_contour">
            <input type="radio" id="contour_none" name="color_contour" value="none" checked/>
            <label for="contour_none">なし</label>

            <input type="radio" id="contour_red" name="color_contour" value="red" />
            <label for="contour_red">赤</label>

            <input type="radio" id="contour_green" name="color_contour" value="green" />
            <label for="contour_green">緑</label>
        </form>
    </fieldset>

    <div class="container">
        <canvas id="imageCanvas" hidden></canvas>
        <canvas id="scaledCanvas"></canvas>
    </div>

    <!-- OpenCV.js を非同期ロードし、ロード完了時に onOpenCvReady をコールバック -->
    <script async src="https://docs.opencv.org/3.4.1/opencv.js" onload="onOpenCvReady();"></script>
    
    <script>
        let isOpenCvReady = false;

        // OpenCV.js の読み込み完了時に呼ばれる関数
        function onOpenCvReady() {
            // WASMの初期化完了を確認（Module.onRuntimeInitialized を使用）
            if (cv.getBuildInformation) {
                isOpenCvReady = true;
                console.log("OpenCV.js is ready.");
            } else {
                cv['onRuntimeInitialized'] = () => {
                    isOpenCvReady = true;
                    console.log("OpenCV.js (WASM) is ready.");
                };
            }
        }

        // 閾値のスライダを動かすとラベルに表示される数値が変わる
        const value = document.querySelector("#value");
        const input = document.querySelector("#threshold");
        value.textContent = input.value;
        input.addEventListener("input", (event) => {
            value.textContent = event.target.value;
        });

        const video = document.createElement("video");
        
        const canvasElement = document.getElementById("imageCanvas");
        const canvas = canvasElement.getContext("2d", { willReadFrequently: true });

        const canvasElement2 = document.getElementById("scaledCanvas");
        const canvas2 = canvasElement2.getContext("2d");

        let getwidth = 800;
        let getheight = 450;

        navigator.mediaDevices.getUserMedia({
            audio: false,
            video: {
                facingMode: { ideal: 'environment' },
                width: { ideal: getwidth },
                height: { ideal: getheight },
                aspectRatio: { ideal: 9 / 16 },
            },
        })
        .then((stream) => {
            video.srcObject = stream;
            video.onloadedmetadata = () => {
                video.play();
                console.log("カメラ表示準備完了");
                requestAnimationFrame(tick);
            };
        })
        .catch((err) => {
            console.error("カメラのアクセスに失敗しました:", err);
        });

        function tick() {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                canvasElement.height = video.videoHeight;
                canvasElement.width = video.videoWidth;
                canvas.drawImage(video, 0, 0, canvasElement.width, canvasElement.height);

                // OpenCV.js の準備が完了するまでは処理をスキップ
                if (!isOpenCvReady) {
                    requestAnimationFrame(tick);
                    return;
                }

                try {
                    let src = cv.imread('imageCanvas');
                    let gray = new cv.Mat();
                    cv.cvtColor(src, gray, cv.COLOR_RGBA2GRAY, 0);

                    let thres = new cv.Mat();
                    cv.threshold(gray, thres, Number(input.value), 255, cv.THRESH_BINARY);

                    let color = new cv.Mat();
                    const radio_contour = document.getElementById("radio_contour");

                    if (radio_contour.color_contour.value !== "none") {
                        let contours = new cv.MatVector();
                        let hierarchy = new cv.Mat();
                        cv.findContours(thres, contours, hierarchy, cv.RETR_LIST, cv.CHAIN_APPROX_SIMPLE);
                        
                        cv.cvtColor(thres, color, cv.COLOR_GRAY2RGBA);
                        
                        let contourColor;
                        const red = document.getElementById("contour_red");
                        if (red.checked) {
                            contourColor = new cv.Scalar(255, 0, 0, 255); // RGBA: 赤
                        } else {
                            contourColor = new cv.Scalar(0, 255, 0, 255); // RGBA: 緑
                        }

                        let thickness = 2;
                        for (let i = 0; i < contours.size(); i++) {
                            cv.drawContours(color, contours, i, contourColor, thickness, cv.LINE_8, hierarchy, 0);
                        }

                        // 関数名のタイポを修正 (drowDateTime -> drawDateTime)
                        const [ctx, strdatetime] = drawDateTime(color);
                        
                        cv.imshow('scaledCanvas', color); // 描画結果を表示
                        
                        color.delete();
                        contours.delete();
                        hierarchy.delete();
                    } else {
                        cv.imshow('scaledCanvas', thres);
                        color.delete(); // Matインスタンスの解放
                    }

                    gray.delete();
                    src.delete();
                    thres.delete();
                } catch (err) {
                    console.error("OpenCV processing error:", err);
                }
            }
            requestAnimationFrame(tick);
        }

        // 関数名の表記を統一 (drowDateTime -> drawDateTime)
        function drawDateTime(matCtx) {
            let now = new Date();
            let datetimeText = now.toLocaleString();
            let strdatetime = "" +
                now.getFullYear() +
                ('0' + (now.getMonth() + 1)).slice(-2) +
                ('0' + now.getDate()).slice(-2) +
                ('0' + now.getHours()).slice(-2) +
                ('0' + now.getMinutes()).slice(-2) +
                ('0' + now.getSeconds()).slice(-2);

            cv.putText(
                matCtx, 
                datetimeText, 
                new cv.Point(10, 30),
                cv.FONT_HERSHEY_SIMPLEX,
                1,
                new cv.Scalar(255, 0, 0, 255), // OpenCVのRGBA順（赤色）
                2,
                cv.LINE_AA
            );
            return [matCtx, strdatetime];
        }
    </script>
</body>
</html>
